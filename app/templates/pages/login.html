{% extends "base.html" %}

{% block title %}Iniciar sesión · {{ app_name }}{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card-wrap">

    <button id="theme-toggle-btn" class="icon-btn login-theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">
      <svg class="icon-sun" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364-1.414-1.414M7.05 7.05 5.636 5.636m12.728 0-1.414 1.414M7.05 16.95l-1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8Z" />
      </svg>
      <svg class="icon-moon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.79A9 9 0 1111.21 3c.4 0 .6.48.33.77A7 7 0 0020.23 12c.29-.27.77-.07.77.33Z" />
      </svg>
    </button>

    <div class="login-card">
      <div class="login-header">
        <svg class="logo" width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h1 class="login-title">{{ app_name }}</h1>
        <p class="login-subtitle">Ingresa con tu cuenta corporativa</p>
      </div>

      {% if error %}
        <div class="status-message error" role="alert">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          </svg>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_url }}" />

        <div class="form-group">
          <label for="email">Correo</label>
          <input class="input" type="email" id="email" name="email"
                 autocomplete="username" required autofocus />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input class="input" type="password" id="password" name="password"
                 autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Ingresar</button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
